[package]
name = "roksync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RokSync: open-source, gaming-focused ambient lighting sync for Windows. Your game. Your lights. In sync."

[[bin]]
name = "roksync"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
lumen-hue.workspace = true
lumen-engine.workspace = true
lumen-cs2.workspace = true
lumen-dota.workspace = true
lumen-cod.workspace = true
lumen-screen.workspace = true
lumen-mood.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"
